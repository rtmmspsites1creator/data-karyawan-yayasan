<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Pendataan Karyawan</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <span class="brand">Pendataan Karyawan</span>
      <nav class="nav">
        <button type="button" id="navForm" class="active" onclick="showView('formView')">Formulir</button>
        <button type="button" id="navAdmin" onclick="openAdmin()">Administrator</button>
      </nav>
    </div>
  </header>

  <main class="page">

    <section id="formView">
      <div class="split">
        <div class="intro">
          <h1>Formulir Data Karyawan</h1>
          <p>Lengkapi data berikut dengan benar. Data yang dikirim hanya dapat dilihat oleh administrator.</p>
        </div>
        <div class="panel">
          <form id="employeeForm" novalidate>
            <div id="formMsg" class="notice hidden" role="status"></div>
            <div class="field">
              <label for="nama">Nama lengkap</label>
              <input class="input" type="text" id="nama" maxlength="100" autocomplete="name" required>
            </div>
            <div class="field">
              <label for="nik">NIK</label>
              <input class="input" type="text" id="nik" maxlength="30" inputmode="numeric" autocomplete="off" required>
            </div>
            <div class="field">
              <label for="yayasan">Yayasan</label>
              <input class="input" type="text" id="yayasan" maxlength="100" required>
            </div>
            <div class="field">
              <label id="lblTgl" for="tglHari">Tanggal mulai bekerja</label>
              <div class="date-group" role="group" aria-labelledby="lblTgl">
                <select class="input" id="tglHari" autocomplete="off" required aria-label="Tanggal"></select>
                <select class="input" id="tglBulan" autocomplete="off" required aria-label="Bulan"></select>
                <select class="input" id="tglTahun" autocomplete="off" required aria-label="Tahun"></select>
              </div>
              <div class="hint">Masa kerja dihitung otomatis dari tanggal ini.</div>
            </div>
            <button type="submit" id="btnSubmit" class="btn block">Kirim data</button>
          </form>
        </div>
      </div>
    </section>

    <section id="loginView" class="hidden">
      <div class="panel narrow">
        <h2>Masuk Administrator</h2>
        <form id="loginForm">
          <div id="loginError" class="notice error hidden" role="alert"></div>
          <div class="field">
            <label for="adminEmail">Email</label>
            <input class="input" type="email" id="adminEmail" autocomplete="username" required>
          </div>
          <div class="field">
            <label for="adminPass">Kata sandi</label>
            <input class="input" type="password" id="adminPass" autocomplete="current-password" required>
          </div>
          <button type="submit" id="btnLogin" class="btn block">Masuk</button>
        </form>
      </div>
    </section>

    <section id="adminView" class="hidden">
      <div class="toolbar">
        <h1>Rekap Data Karyawan</h1>
        <div class="toolbar-actions">
          <input class="input" type="search" id="searchInput" placeholder="Cari nama, NIK, yayasan" oninput="renderView()" aria-label="Cari data">
          <button type="button" class="btn ghost" onclick="handleLogout()">Keluar</button>
        </div>
      </div>

      <dl class="stats">
        <div class="stat"><dt>Total data</dt><dd id="statTotal">0</dd></div>
        <div class="stat"><dt>Yayasan</dt><dd id="statYayasan">0</dd></div>
        <div class="stat"><dt>Rata-rata masa kerja</dt><dd id="statAvg">-</dd></div>
      </dl>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="col-no">No</th>
              <th data-sort="nama" aria-sort="none"><button type="button" class="sort-btn" onclick="sortData('nama')">Nama</button></th>
              <th data-sort="nik" aria-sort="none"><button type="button" class="sort-btn" onclick="sortData('nik')">NIK</button></th>
              <th data-sort="yayasan" aria-sort="none"><button type="button" class="sort-btn" onclick="sortData('yayasan')">Yayasan</button></th>
              <th data-sort="masaKerja" aria-sort="none"><button type="button" class="sort-btn" onclick="sortData('masaKerja')">Tanggal Masuk</button></th>
              <th data-sort="masaKerja" aria-sort="none"><button type="button" class="sort-btn" onclick="sortData('masaKerja')">Masa Kerja</button></th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </section>

  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
